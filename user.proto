syntax = "proto3";

service UserService {
    rpc CreateUser(User) returns (CreateResponse); // Unary RPC
}

message CreateUserRequest {
    string name = 1;
    string email = 2;
    string password = 3;
}

message Address {
    int64 id = 1;
    string full_address = 2;
    string province = 3;
    string city = 4;
}

message User {
    reserved 2;
    int64 id = 1;
    int64 age = 3;
    double balance = 4;
    bool is_active = 5;
    Address address = 6;
    repeated string educations = 7;
    string spouse_name = 8;    
}

message CreateResponse {
    string message = 1;
}
